<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boardle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- Google AdSense (client: ca-pub-7547353458300611) -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7547353458300611"
     crossorigin="anonymous"></script>
<style>
  :root{
    --felt:#10170F;
    --felt-2:#182219;
    --felt-3:#1E2B1F;
    --brass:#D4A73A;
    --cream:#F1ECDD;
    --dim:#92A08D;
    --line: rgba(212,167,58,0.18);

    --pf-a:#C9A24B;
    --pf-glow: 201,162,75;

    --ya-a:#FF4D82;
    --ya-glow: 255,77,130;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(212,167,58,0.07), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(124,108,255,0.06), transparent 55%),
      var(--felt);
    color:var(--cream);
    font-family:'Gothic A1', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(25deg, rgba(0,0,0,0.06) 0 2px, transparent 2px 5px);
  }

  .wrap{
    max-width:760px;margin:0 auto;padding:0 24px;position:relative;z-index:1;
    flex:1; display:flex; flex-direction:column; justify-content:center;
    min-height:100vh;
  }

  header{ text-align:center; margin-bottom:52px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-size:12px; letter-spacing:0.36em; font-weight:700;
    color:var(--brass); text-transform:uppercase;
  }
  .eyebrow::before, .eyebrow::after{
    content:""; width:22px; height:1px; background:var(--brass); opacity:0.7;
  }

  .shelf{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  @media (max-width:560px){
    .shelf{grid-template-columns:1fr;}
  }

  .card{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
    background:linear-gradient(180deg, var(--felt-3), var(--felt-2));
    border:1px solid var(--line);
    border-radius:16px;
    padding:52px 20px;
    text-decoration:none;
    color:inherit;
    overflow:hidden;
    isolation:isolate;
    transition:transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
  }
  .card::after{
    content:"";
    position:absolute; inset:0; z-index:-1;
    opacity:0.45;
    transition:opacity 260ms ease;
  }
  .card--pf::after{ background:radial-gradient(420px 260px at 50% 0%, rgba(var(--pf-glow),0.18), transparent 65%); }
  .card--ya::after{ background:radial-gradient(420px 260px at 50% 0%, rgba(var(--ya-glow),0.18), transparent 65%); }

  .card:hover, .card:focus-visible{
    transform:translateY(-5px);
    box-shadow:0 20px 36px -18px rgba(0,0,0,0.55);
  }
  .card--pf:hover, .card--pf:focus-visible{ border-color:rgba(var(--pf-glow),0.55); }
  .card--ya:hover, .card--ya:focus-visible{ border-color:rgba(var(--ya-glow),0.55); }
  .card:hover::after, .card:focus-visible::after{ opacity:0.85; }
  .card:focus-visible{ outline:2px solid var(--brass); outline-offset:3px; }

  .glyph{ width:64px; height:64px; transition:transform 220ms ease; }
  .card:hover .glyph{ transform:scale(1.06); }

  .card h2{
    font-family:'Gowun Batang', serif;
    font-weight:700;
    font-size:20px;
    margin:0;
    color:var(--cream);
    letter-spacing:-0.01em;
    text-align:center;
  }

  footer{
    text-align:center;
    padding:32px 0 28px;
    font-size:12px; color:var(--dim); opacity:0.7;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .glyph{ transition:none; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <header>
      <div class="eyebrow">BOARDLE</div>
    </header>

    <div class="shelf">

      <a class="card card--pf" href="./Power-Flower/">
        <svg class="glyph" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g stroke="var(--pf-a)" stroke-width="1.6">
            <circle cx="24" cy="24" r="6.5" fill="rgba(201,162,75,0.18)"/>
            <ellipse cx="24" cy="10" rx="6" ry="9" fill="rgba(201,162,75,0.10)"/>
            <ellipse cx="24" cy="38" rx="6" ry="9" fill="rgba(201,162,75,0.10)"/>
            <ellipse cx="10" cy="24" rx="9" ry="6" fill="rgba(201,162,75,0.10)"/>
            <ellipse cx="38" cy="24" rx="9" ry="6" fill="rgba(201,162,75,0.10)"/>
          </g>
        </svg>
        <h2>파워플라워</h2>
      </a>

      <a class="card card--ya" href="./YAYAGA/">
        <svg class="glyph" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g>
            <rect x="10" y="10" width="14" height="14" rx="3" transform="rotate(-8 17 17)" fill="rgba(255,77,130,0.16)" stroke="var(--ya-a)" stroke-width="1.6"/>
            <rect x="24" y="22" width="14" height="14" rx="3" transform="rotate(10 31 29)" fill="rgba(124,108,255,0.18)" stroke="#7C6CFF" stroke-width="1.6"/>
            <circle cx="35" cy="12" r="2" fill="var(--ya-a)"/>
            <circle cx="13" cy="35" r="2" fill="#7C6CFF"/>
          </g>
        </svg>
        <h2>YAYAGA online</h2>
      </a>

    </div>

    <footer>© 2026 Boardle</footer>
  </div>

</body>
</html>
